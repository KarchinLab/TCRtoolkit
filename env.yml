name: base
channels:
  - conda-forge
  - bioconda
dependencies:  
  # Python
  - python=3.11.5
  - pandas=2.2.3
  - numpy=1.25.2
  - scipy=1.11.3
  - seaborn=0.13.0
  - dash>=2.15.0
  - matplotlib=3.8.1
  - pip=26.1.2
  - fsspec=2024.3.1
  - s3fs=2024.3.1
  - python-igraph=0.11.8
  - scikit-learn=1.6.1
  - olga=1.2.4
  - levenshtein=0.27.1
  - biopython=1.85
  - h5py=3.14.0
  - faiss=1.9.0
  - rpy2=3.6.4
  - unzip
  - openjdk=8
  - parasail-python
  - jupyter
  - upsetplot=0.9.0

  # R and R packages
  - r-base=4.4.2
  - r-grr=0.9.5
  - r-igraph=2.0.3
  - r-pheatmap=1.0.12
  - r-remotes=2.5.0
  - r-seurat=5.3.1
  - r-seuratobject=5.2.0

  # Pip packages
  - pip:
    - papermill
    - csvkit==1.3.0
    - plotly==5.18.0
    - abydos==0.5.0
    - fastcluster==1.2.6
    - git+https://github.com/kmayerb/tcrdist3.git@0.2.2
